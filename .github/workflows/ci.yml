name: Build and Release

on:
  release:
    types: [created]
  workflow_dispatch:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (fmt, clippy, tests, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
          cache: true
          cache-workspaces: .

      - name: Run fmt check
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        if: github.event_name == 'pull_request'
        run: cargo test --all --no-fail-fast

      - name: Install cargo-llvm-cov
        if: github.event_name != 'pull_request'
        run: cargo install cargo-llvm-cov --locked

      - name: Run tests with coverage
        if: github.event_name != 'pull_request'
        env:
          CARGO_INCREMENTAL: 0
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info --no-fail-fast

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v6
        with:
          files: ./lcov.info
          flags: coverage
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build_binaries:
    name: Build ${{ matrix.platform.os_name }}
    if: github.event_name == 'release'
    needs: checks
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: macOS-aarch64
            os: macos-26
            target: aarch64-apple-darwin
            bin: rusty_apple_mail_mcp_macos_aarch64
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: .
          target: ${{ matrix.platform.target }}

      - name: Build binary
        run: cargo build --bin rusty_apple_mail_mcp --release --target ${{ matrix.platform.target }}

      - name: Prepare artifact
        run: |
          mkdir -p app/${{ matrix.platform.target }}
          cp target/${{ matrix.platform.target }}/release/rusty_apple_mail_mcp app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}

      - name: Generate SHA-256
        run: |
          shasum -a 256 app/${{ matrix.platform.target }}/${{ matrix.platform.bin }} | cut -d ' ' -f 1 > app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}.sha256

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}
            app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
