[package]
name = "rusty_apple_mail_mcp"
version = "1.12.0"
edition = "2024"
resolver = "3"


[[bin]]
name = "rusty_apple_mail_mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.53.3", features = [
  "rt-multi-thread",
  "macros",
  "io-util"
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
walkdir = "2.5.0"
mail-parser = "0.11.9"
schemars = "1.2.3"
once_cell = "1.21.4"
lru = "0.18.5"
scraper = "0.27.0"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
csv = "1.4.0"
lopdf = "0.45.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3

[profile.test]
inherits = "dev"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
